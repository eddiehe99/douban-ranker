<!-- 站点自定义 <head> 内容：
    本文件由 jekyll-theme-time-machine 的 default.html 布局自动注入，
    覆盖主题自带的 _includes/head-custom.html，因此需保留 GA 引入逻辑。 -->

<!-- Google Analytics（在 _config.yml 中设置 google_analytics 后生效） -->
{% include head-custom-google-analytics.html %}

<!-- 站点 favicon：
    必须指向站点自己的实体文件（仓库根目录的 favicon.ico 由 Jekyll 自动发布）。
    absolute_url 会在构建时把路径展开成完整地址，兼容性最好。
    按 opengraph.to 检测建议同时提供 .ico 与 .png 两种格式。 -->
<link rel="icon" href="{{ '/favicon.ico' | absolute_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | absolute_url }}">
